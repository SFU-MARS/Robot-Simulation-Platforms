[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nav_core"
version = "0.1.0"
description = "ROS-free navigation core: robot profiles, mapping, nominal controllers"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "contourpy", "pyyaml"]

[tool.setuptools.packages.find]
include = ["nav_core*"]
